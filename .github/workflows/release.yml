name: Release

on:
  schedule:
    # Monday 09:17 Asia/Shanghai. GitHub cron is UTC.
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install locked runtime
        run: |
          uv venv --python 3.12 engine/.venv
          uv pip install --python engine/.venv/bin/python -r engine/requirements.lock -e engine
      - name: Test main before releasing
        run: engine/.venv/bin/python -m pytest engine/tests -q
      - name: Compute next version
        id: next
        run: |
          version=$(engine/.venv/bin/python scripts/release.py --next)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          engine/.venv/bin/python scripts/release.py --apply "$VERSION"
          git add engine/pyproject.toml
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
          git push origin HEAD:stable
          gh release create "v$VERSION" --generate-notes --title "v$VERSION"
          (cd engine && uv build)
          gh release upload "v$VERSION" dist/* --clobber
