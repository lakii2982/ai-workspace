name: CI

on:
  pull_request:
  push:
    branches: [main, stable]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check PR title, branch and compatibility changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_pr.py --title "$PR_TITLE" --branch "$PR_BRANCH" --base "origin/$BASE_REF"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.6
      - run: ruff check --select E9,F --output-format concise engine scripts

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install locked runtime
        run: |
          uv venv --python "${{ matrix.python }}" engine/.venv
          uv pip install --python engine/.venv/bin/python -r engine/requirements.lock -e engine
      - name: Test
        run: engine/.venv/bin/python -m pytest engine/tests -q

  install-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install into a throwaway workspace and verify
        run: ./scripts/verify-install.sh
