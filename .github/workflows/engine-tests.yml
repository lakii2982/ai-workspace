name: Engine tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime and test dependencies
        run: |
          python -m venv engine/.venv
          engine/.venv/bin/python -m pip install -r engine/requirements.lock -e engine
      - name: Test public interfaces and upgrade recovery
        run: engine/.venv/bin/python -m pytest engine/tests -q
