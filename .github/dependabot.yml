version: 2
updates:
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: '10:17'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:17'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
